name=WiFiProvision
version=1.0.0
author=Nate Kocher
maintainer=Nate Kocher <ngk0@users.noreply.github.com>
sentence=On-device WiFi setup for SAMD boards with an ATWINC1500.
paragraph=Scan list, on-screen keyboard with upper case and symbol layers, credential store and a connect flow, so a sketch can join a network without the SSID and password being compiled in. ESP32 has WiFiManager; this fills the same hole for WiFi101. Touch input and persistence are both supplied by the caller, so any touch controller works and the library has no opinion about FlashStorage, EEPROM or SD. Every on-screen action is mirrored on a serial command interface, which makes the flow testable and is the way out when a panel is miscalibrated.
category=Communication
url=https://github.com/ngk0/WiFiProvision
architectures=samd
depends=WiFi101,Adafruit GFX Library
